<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="world" aria-label="Ba hòn đảo"></canvas>
  <header><p id="night-label"></p></header>
  <aside class="hud" aria-label="Trạng thái">
    <span class="health">Ngọn Lửa <strong id="flames">-</strong></span>
    <strong id="clock" class="clock">-</strong>
    <span class="score">Đèn <strong id="lanterns">-</strong> · Điểm <strong id="score">-</strong></span>
    <span class="light"><span id="mote-meter" aria-hidden="true"></span><strong id="light">-</strong></span>
    <span class="cooldowns">Lướt <strong id="dash-cd">-</strong> · Tỏa Sáng <strong id="pulse-cd">-</strong></span>
  </aside>
  <span id="direction" hidden>↑</span>
  <span id="shade-direction" hidden aria-label="Hướng Bóng Mực vừa xuất hiện">↑</span>
  <div id="captions" role="status" aria-live="polite" hidden></div>
  <div id="hint" role="status"></div>
  <footer id="controls-guide"></footer>
  <section id="overlay">
    <div class="panel">
      <h2 id="title">Đảo Đèn Lồng</h2>
      <p id="message"></p>
      <div id="settings-fields" hidden>
        <label>Âm lượng <input id="volume" type="range" min="0" max="1" step="0.05"></label>
        <label>Độ nhạy chuột <input id="sensitivity" type="range" min="0.1" max="2" step="0.1"></label>
        <label>Bảng màu dễ phân biệt <input id="accessible-palette" type="checkbox"></label>
        <label>Giảm chuyển động <input id="reduce-motion" type="checkbox"></label>
        <label>Chữ lớn <input id="large-text" type="checkbox"></label>
        <fieldset id="key-settings">
          <legend>Phím điều khiển</legend>
          <div id="key-bindings"></div>
          <p id="key-feedback" role="status"></p>
          <button id="restore-keys" type="button">Khôi phục mặc định</button>
        </fieldset>
      </div>
      <form id="score-form" hidden>
        <label>Tên <input id="score-name" required minlength="3" maxlength="12" pattern="[A-Za-z0-9_]{3,12}"
          title="3–12 chữ cái không dấu, chữ số hoặc dấu gạch dưới"></label>
        <button type="submit">Lưu điểm</button>
      </form>
      <p id="score-feedback" role="status" hidden></p>
      <ol id="leaderboard" aria-label="Mười điểm cao nhất" hidden></ol>
      <button id="start">Bắt đầu</button>
      <button id="menu-settings" hidden>Cài đặt</button>
      <button id="open-leaderboard" hidden>Bảng xếp hạng</button>
      <div id="pause-actions" hidden>
        <button id="restart">Chơi lại Đêm</button>
        <button id="pause-settings">Cài đặt</button>
        <button id="quit">Về menu</button>
      </div>
    </div>
  </section>
  <script type="module" src="./view.mjs"></script>
</body>
</html>
